
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrar Materias</title>
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body>

    <header>
        <h1>Registro de Materias</h1>
        <p>Carrera de Sistemas de Información</p>
    </header>

    <nav>
        <a href="index.html">Inicio</a>
        <a href="registro.html">Registrar Materias</a>
        <a href="materias.html">Materias Registradas</a>
    </nav>

    <main>
        <h2>Registrar Nueva Materia</h2>

        <form id="formulario">
            <input type="hidden" id="codigo" >

            <label for="nombre">Nombre de la materia:</label>
            <input type="text" id="nombre" required>

            <label for="nivel">Nivel:</label>
            <select id="nivel" required>
                <option value="">Seleccione un nivel</option>
                <option value="Primero">Primero</option>
                <option value="Segundo">Segundo</option>
                <option value="Tercero">Tercero</option>
                <option value="Cuarto">Cuarto</option>
                <option value="Quinto">Quinto</option>
                <option value="Sexto">Sexto</option>
                <option value="Séptimo">Séptimo</option>
                <option value="Octavo">Octavo</option>
            </select>

            <label for="creditos">Créditos:</label>
            <input type="number" id="creditos" min="1" required>

            <label for="docente">Docente:</label>
            <input type="text" id="docente" required>

            <button type="submit">Guardar Materia</button>

        </form>

        <p id="mensaje" aria-live="polite"></p>
    </main>

    <footer>
        <p>Proyecto de Desarrollo Basado en Plataformas Web</p>
    </footer>

    <script src="js/validaciones_registro.js"></script>
    <script src="js/funciones.js"></script>
</body>
</html>
